<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>BALLAST — Steal weight. Give it back.</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    min-height: 100%;
    background: #0c0e1c;
    color: #f2e8d8;
    font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 16px 12px 24px;
    box-sizing: border-box;
  }
  canvas {
    width: min(960px, 96vw);
    aspect-ratio: 960 / 600;
    height: auto;
    display: block;
    border: 1px solid #3a4170;
    border-radius: 10px;
    box-shadow: 0 18px 60px rgba(0, 0, 0, 0.55);
    background: #12162e;
    touch-action: none;
    cursor: pointer;
  }
  footer {
    font-size: 13px;
    color: #aab0d0;
    text-align: center;
    line-height: 1.5;
  }
  footer b { color: #ffd76a; font-weight: 600; }
</style>
</head>
<body>
<canvas id="game" width="960" height="600"></canvas>
<footer>
  <b>BALLAST</b> — steal weight with <b>E</b> / left click, give it back with <b>Q</b> / right click.
  Move with ← →, jump with Space. <b>P</b> pauses, <b>R</b> retries, <b>M</b> mutes.
</footer>
<script type="module" src="./src/main.js"></script>
</body>
</html>
